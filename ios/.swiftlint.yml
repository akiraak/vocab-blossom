included:
  - VocabBlossom
  - VocabBlossomTests

excluded:
  - VocabBlossom.xcodeproj

disabled_rules:
  # SwiftUI の View は宣言的に長くなるため、行数系は緩める
  - type_body_length
  - file_length
  - todo
  # 複数行のコレクションリテラルは末尾カンマを付ける（差分が読みやすい）
  - trailing_comma

line_length:
  warning: 110
  error: 140
  ignores_comments: true

identifier_name:
  min_length: 1
  excluded:
    - id

function_body_length:
  warning: 80
  error: 120

nesting:
  type_level: 2
