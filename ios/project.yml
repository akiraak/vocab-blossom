name: VocabBlossom

options:
  bundleIdPrefix: com.akiraak
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # 実機ビルドは `DEVELOPMENT_TEAM=XXXXXXXXXX xcodegen generate` でチームを差し込む
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

targets:
  VocabBlossom:
    type: application
    platform: iOS
    sources:
      - path: VocabBlossom
        # サーバー設定の見本はバンドルに入れない（実物の ServerConfig.plist は git 管理外で、あれば同梱される）
        excludes:
          - "**/*.example.plist"
      # 単語データ（data/decks）はフォルダ参照でバンドルへ同梱する。
      # Node/Python 側の整備パイプラインと同じ実体を参照するため、コピーを持たない。
      - path: ../data/decks
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akiraak.VocabBlossom
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: vocab-blossom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: VocabBlossom/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # グループの読み上げを、画面を消しても続ける（ロック画面・コントロールセンターから操作する）
        UIBackgroundModes:
          - audio
        # ローカルの管理画面サーバー（http://<Mac の IP>:3015）で同期を試せるようにする。本番は https
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  VocabBlossomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VocabBlossomTests
    dependencies:
      - target: VocabBlossom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akiraak.VocabBlossomTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VocabBlossom:
    build:
      targets:
        VocabBlossom: all
        VocabBlossomTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - VocabBlossomTests
